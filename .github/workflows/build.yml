name: Build Processing Sketch

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install Processing 4
        run: |
          wget -q https://github.com/processing/processing4/releases/download/processing-1313-4.5.2/processing-4.5.2-linux-x64-portable.zip
          unzip -q processing-4.5.2-linux-x64-portable.zip
          sudo mv processing-4.5.2 /opt/processing

      - name: Install Video Library
        run: |
          mkdir -p ~/sketchbook/libraries
          wget -q https://github.com/processing/processing-video/releases/download/latest/video.zip
          unzip -q video.zip -d ~/sketchbook/libraries/

      - name: Build sketch
        run: |
          /opt/processing/processing-java \
            --sketchbook="$HOME/sketchbook" \
            --sketch="$(pwd)/SpaceRocket" \
            --build
